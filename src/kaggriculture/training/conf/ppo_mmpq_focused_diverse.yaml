defaults:
  - ppo
  - _self_

experiment:
  name: ppo_day11plus_mmpq_ppo_light_diverse_v1

env:
  state_bank_path: data/state_banks/opening_mmpq_focused_self_train_v1.pkl
  eval_state_bank_path: data/state_banks/opening_mmpq_focused_self_eval_v1.pkl

ppo:
  total_updates: 300
  rollout_horizon: 456
  init_bc_checkpoint: outputs/bc/day11plus_mmpq_ppo_light_v1/2026-09-29/22-33-21/checkpoints/best
  anchor_bc_checkpoint: outputs/bc/day11plus_mmpq_ppo_light_v1/2026-09-29/22-33-21/checkpoints/best
  reference_checkpoint: outputs/bc/day11plus_mmpq_ppo_light_v1/2026-09-29/22-33-21/checkpoints/best
  matched_opponents:
    - name: mmpq_focused
      checkpoint: outputs/bc/day11plus_mmpq_focused_v1/2026-09-29/21-48-09/checkpoints/best
      opening_checkpoint: outputs/bc/opening_day10_mmpq_focused_v1/2026-09-29/21-48-09/checkpoints/best
      require_learner_lands: 4
      require_opponent_lands: 4
      state_bank_path: data/state_banks/opening_mmpq_focused_vs_mmpq_train_v1.pkl
    - name: decem_focused
      checkpoint: outputs/bc/day11plus_decem_focused_v1/2026-09-29/21-16-21/checkpoints/best
      opening_checkpoint: outputs/bc/opening_day10_decem_focused_v1/2026-09-29/21-16-21/checkpoints/best
      require_learner_lands: 4
      require_opponent_lands: 4
      state_bank_path: data/state_banks/opening_mmpq_focused_vs_decem_train_v1.pkl
    - name: dsm_focused
      checkpoint: outputs/bc/day11plus_dsm_focused_v1/2026-09-29/18-27-32/checkpoints/best
      opening_checkpoint: outputs/bc/opening_day10_dsm_focused_v1/2026-09-29/18-27-32/checkpoints/best
      require_learner_lands: 4
      require_opponent_lands: null
      state_bank_path: data/state_banks/opening_mmpq_focused_vs_dsm_train_v1.pkl
    - name: vadim_focused
      checkpoint: outputs/bc/day11plus_vadim_focused_v1/2026-09-29/19-39-05/checkpoints/best
      opening_checkpoint: outputs/bc/opening_day10_vadim_focused_v1/2026-09-29/19-39-05/checkpoints/best
      require_learner_lands: 4
      require_opponent_lands: null
      state_bank_path: data/state_banks/opening_mmpq_focused_vs_vadim_train_v1.pkl
