defaults:
  - model: default
  - rules: default
  - _self_

experiment:
  name: baseline

hydra:
  job:
    name: ppo
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${hydra.job.name}/${experiment.name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Actor構造はmodel/default.yamlと共有し、PPOだけcriticを追加する。
model:
  use_asymmetric_critic: true

env:
  batch_size: 64
  board_size: ${rules.board_size}
  turns_per_day: ${rules.turns_per_day}
  shed_capacity: ${rules.shed_capacity}
  weed_chance: ${rules.weed_chance}
  shop_unlock_interval: ${rules.shop_unlock_interval}
  shop_sell_interval: ${rules.shop_sell_interval}
  center_sell_interval: ${rules.center_sell_interval}
  hire_mult: ${rules.hire_mult}
  max_shop_instances: ${rules.max_shop_instances}
  episode_steps: ${rules.episode_steps}
  starting_money: ${rules.starting_money}

ppo:
  total_updates: 1000
  rollout_horizon: 128
  update_epochs: 4
  minibatch_size: 256
  # BCからfine-tuningする初期値。スクラッチ学習では別途比較する。
  learning_rate: 1.0e-4
  weight_decay: 0.0
  gamma: 0.999
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 1.0
  temperature: 0.8
  # "token"は長い複合行動でclip飽和しにくい。理論上のjoint比率も選択可能。
  ratio_mode: token
  seed: 0
  log_interval: 10
  checkpoint_interval: 50
  keep_last_checkpoints: 5
  # 更新開始時の固定方策を相手に、教師なしで終端まで自走評価する。0なら無効。
  eval_interval: 50
  # 各相手について両席でこの局数ずつ評価する。
  eval_episodes: 32
  # 追加のJAX PPO checkpoint。開始時の固定方策は常に評価相手へ含まれる。
  eval_opponent_checkpoints: []
  # JAX BC directoryまたは旧PyTorch BC fileからactorだけを初期化する。
  init_bc_checkpoint: null
  # JAX PPO checkpointからoptimizerを含めて再開する。init_bc_checkpointとは排他。
  resume_checkpoint: null
