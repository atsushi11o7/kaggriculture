defaults:
  - model: default
  - rules: default
  - _self_

experiment:
  name: baseline

hydra:
  job:
    name: ppo
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

env:
  batch_size: 32

ppo:
  total_updates: 1000
  rollout_horizon: 720
  update_epochs: 1
  # 0以外なら、完了試合をこのラウンド数だけ集め(1ラウンド=全環境が1試合を最後まで)、勾配を蓄積して
  # 1回だけ更新する(full_game.py)。1 updateの試合数はラウンド数×env.batch_size。
  full_game_rounds: 2
  # 蓄積時に状態を再生成する区間の長さ(メモリと速度の兼ね合い)。
  full_game_segment_length: 144
  # 価値の教師のλ。1.0なら、criticの予測を含まない実際のreturn(モンテカルロ)。
  value_lambda: 1.0
  minibatch_size: 256
  learning_rate: 5.0e-5
  weight_decay: 0.0
  # PPO更新前にActorを固定し、on-policyの完了試合でcriticだけを適応させる。
  critic_warmup_updates: 0
  critic_warmup_epochs: 4
  critic_warmup_learning_rate: 5.0e-5
  gamma: 0.999
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  # 日末・終端に前回評価時からの概算資産差改善を小さく加える。
  daily_reward_coefficient: 0.0
  daily_reward_scale: 10000.0
  daily_reward_maximum: 0.02
  # 固定した参照Actorからのパラメータ乖離を抑える係数(0で無効)。
  reference_actor_l2_coef: 0.1
  # epoch平均KLが閾値を超えたら、そのrolloutに対する残りのepochを打ち切る。
  target_kl: 0.02
  max_grad_norm: 1.0
  temperature: 0.8
  seed: 0
  log_interval: 1
  checkpoint_interval: 50
  # step_*だけ古い順に削除する(best/poolは対象外)。0以下で無効。
  keep_last_checkpoints: 5
  # joint BCならActorとcriticを、Actor-only BCならActorだけを読み込む。
  init_bc_checkpoint: null
  # 事前学習したActor+criticを読み込む。報酬変更時はcritic warm-upが必須。
  init_value_checkpoint: null
  # trueなら、初期criticと報酬設定が違っても、warm-upなしで読み込む(criticはPPOの学習で適応する)。
  allow_value_reward_mismatch: false
  # nullならinit_bc_checkpoint、resume時は元runの設定から固定BCを復元する。
  anchor_bc_checkpoint: null
  # 保持項の参照先。nullならanchor_bc_checkpoint/初期BCを使う。BC/PPO両対応。
  reference_checkpoint: null
  resume_checkpoint: null
  # このupdate間隔でcandidateをchekcpoints/best/と対戦させ、昇格判定を行う。0以下で無効。
  eval_interval: 50
  eval_episodes: 32
  # 昇格に必要な勝率(24位のPokemon TCGソリューションと同じ値)。
  promotion_win_rate: 0.52
  # 固定BCに対して退化したcandidateを昇格させない。
  anchor_promotion_win_rate: 0.5
  # 昇格したcandidateを追加保存するpopulation-based self-play用の対戦相手プール。
  # checkpoints/配下の相対名(実行ディレクトリ内に閉じる。絶対パス化すると
  # 実行間で共有される固定パスになり、別runのpool対戦相手が混ざってしまう)。
  pool_dir: pool
  pool_size: 5
  # rollout相手は固定BC 50%、昇格済みpool 50%(self-playは使わない)。
  # poolが空ならpool分もanchorへ回す。
  anchor_sample_prob: 0.5
  pool_sample_prob: 0.5
