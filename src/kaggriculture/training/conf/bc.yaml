defaults:
  - model: default
  - rules: default
  - _self_

experiment:
  name: baseline

hydra:
  job:
    name: bc
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_dir: data/replays
  selection_dir: null
  num_episodes: null
  val_fraction: 0.1
  split_seed: 0
  cache_dir: data/cache/bc
  min_player_reward: null

train:
  learning_rate: 3.0e-4
  # cosine decayの最終学習率はlearning_rate * lr_decay_alpha。
  lr_decay_alpha: 0.1
  batch_size: 128
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_epochs: 20
  max_steps: -1
  log_interval: 50
  validation_batches: 100
  checkpoint_interval: 3000
  seed: 0
  resume_checkpoint: null
