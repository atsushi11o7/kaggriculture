defaults:
  - model: default
  - rules: default
  - _self_

experiment:
  name: baseline

hydra:
  job:
    name: bc
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

data:
  data_dir: data/replays
  selection_dir: null
  num_episodes: null
  val_fraction: 0.1
  split_seed: 0
  cache_dir: data/cache/bc
  min_player_reward: null

train:
  learning_rate: 3.0e-4
  # cosine decayの最終学習率はlearning_rate * lr_decay_alpha。
  lr_decay_alpha: 0.1
  batch_size: 128
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_epochs: 20
  max_steps: -1
  log_interval: 50
  validation_batches: 100
  # 学習時に、この数のshard(試合・プレイヤー)をまとめて混ぜてからbatch化する。
  shuffle_shards: 32
  checkpoint_interval: 3000
  seed: 0
  # 0なら従来どおりActorのみを学習する。正値なら非対称criticも同じ更新で学習する。
  value_loss_coefficient: 0.5
  value_gamma: 0.999
  daily_reward_coefficient: 0.0
  daily_reward_scale: 10000.0
  daily_reward_maximum: 0.02
  resume_checkpoint: null
  # 別のBC checkpointからparamsだけを引き継いでゼロから学習を始める(step・
  # epoch・optimizer state・学習率scheduleの位置は引き継がない)。同じ実行を
  # 続きから再開したいだけならresume_checkpointを使うこと(両立不可)。
  init_checkpoint: null
  # Actorとcriticを含むvalue_pretrainまたはjoint BC checkpointから初期化する。
  init_value_checkpoint: null
