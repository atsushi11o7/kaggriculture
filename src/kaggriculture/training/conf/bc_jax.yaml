defaults:
  - model: default
  - _self_

experiment:
  name: baseline

hydra:
  job:
    name: bc_jax
    chdir: true
  run:
    dir: outputs/${hydra.job.name}/${experiment.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/${hydra.job.name}/${experiment.name}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

data:
  # 全日付からseed固定で抽出。全件学習時はnum_episodes=nullを指定する。
  data_dir: data/replays
  num_episodes: 256
  val_fraction: 0.1
  split_seed: 0
  turns_per_day: 24
  shed_capacity: 100
  hire_mult: 1
  max_market_orders: 10
  manifest_dir: null
  min_avg_agent_score: null
  min_agent_score: null
  min_player_reward: null
  # JSON・合法手正規化を一度だけ行い、以降のepochと実験で共有する。
  cache_dir: data/cache/bc_jax

train:
  learning_rate: 3.0e-4
  batch_size: 64
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_epochs: 2
  max_steps: -1
  log_interval: 50
  val_interval: 1000
  val_batches: 100
  checkpoint_interval: 1000
  keep_last_checkpoints: 3
  seed: 0
  # JAX BC checkpointからoptimizerを含めて再開する。
  init_checkpoint: null
  # JAX BC checkpointから重みだけを読み込み、optimizerとstepは初期化する。
  init_weights: null
